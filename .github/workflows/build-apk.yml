name: Compilar APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: Compilar
        run: ./gradlew assembleRelease --no-daemon --stacktrace

      - name: Preparar el APK
        run: cp app/build/outputs/apk/release/app-release.apk CuentaCarro.apk

      - uses: actions/upload-artifact@v4
        with:
          name: CuentaCarro-apk
          path: CuentaCarro.apk

      - name: Publicar la descarga
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Cuenta Carro (compilación ${{ github.run_number }})
          files: CuentaCarro.apk
